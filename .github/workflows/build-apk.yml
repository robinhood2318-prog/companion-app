name: Build Android APK

on:
  push:
    branches: [ main, master, 'feature/**' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read

env:
  GRADLE_VERSION: "8.14.4"

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle (also validates any committed wrapper JAR)
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}

      - name: Generate Gradle wrapper if it is missing
        run: |
          if [ ! -f gradle/wrapper/gradle-wrapper.jar ]; then
            gradle wrapper --gradle-version "$GRADLE_VERSION" --distribution-type bin
          fi
          chmod +x gradlew

      # Every build must be signed with the same key, otherwise Android refuses to
      # install it as an update over an earlier beta. The key lives in a repository secret.
      - name: Use the fixed test signing key
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$DEBUG_KEYSTORE_BASE64" ]; then
            mkdir -p ~/.android
            echo "$DEBUG_KEYSTORE_BASE64" | base64 -d > ~/.android/debug.keystore
            echo "Using the fixed test signing key."
          else
            echo "::warning::DEBUG_KEYSTORE_BASE64 secret is not set. This APK is signed with a random key and will NOT install over earlier builds."
          fi

      - name: Read app version
        run: |
          VERSION=$(grep -m1 'versionName' app/build.gradle.kts | sed 's/.*"\(.*\)".*/\1/')
          BRANCH=$(echo "${GITHUB_REF_NAME}" | tr '/' '-')
          echo "APP_VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "ARTIFACT_NAME=FocusTask-$VERSION-$BRANCH-debug" >> "$GITHUB_ENV"

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Name the APK after its version
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/*.apk "dist/FocusTask-${APP_VERSION}-debug.apk"

      - name: Run Android Lint
        run: ./gradlew lintDebug
        continue-on-error: true

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: dist/*.apk
          retention-days: 30

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-report
          path: app/build/reports/lint-results-debug.html
          if-no-files-found: ignore
          retention-days: 14
